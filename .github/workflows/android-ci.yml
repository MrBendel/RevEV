name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test release authorization
        run: node --test scripts/release_authorization.test.cjs
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Check DSP and audio mixer
        run: |
          c++ -std=c++17 -O2 packages/revev_engine/native/listening_mix_test.cpp -o /tmp/revev-listening-test
          /tmp/revev-listening-test
          c++ -std=c++17 -O2 packages/revev_engine/native/output_limiter_test.cpp -o /tmp/revev-limiter-test
          /tmp/revev-limiter-test
          c++ -std=c++17 -O2 packages/revev_engine/native/turbo_test.cpp -o /tmp/revev-turbo-test
          /tmp/revev-turbo-test
          c++ -std=c++17 -O2 packages/revev_engine/native/audio_mixer_test.cpp -o /tmp/revev-mixer-test
          /tmp/revev-mixer-test
          c++ -std=c++17 -O2 packages/revev_engine/native/transmission_model_test.cpp -o /tmp/revev-transmission-test
          /tmp/revev-transmission-test
          c++ -std=c++17 -O2 packages/revev_engine/native/drive_rpm_governor_test.cpp -o /tmp/revev-drive-governor-test
          /tmp/revev-drive-governor-test
          c++ -std=c++17 -O2 packages/revev_engine/native/tire_squeal_test.cpp -o /tmp/revev-tire-squeal-test
          /tmp/revev-tire-squeal-test
      - run: flutter build apk --debug
      - name: Test Android motion estimator
        working-directory: android
        run: bash ./gradlew :revev_engine:testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
