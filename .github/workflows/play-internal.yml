name: Play internal release
run-name: Play internal release (${{ github.event_name == 'issue_comment' && format('PR #{0}', github.event.issue.number) || github.ref_name }}) by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to Play internal testing (requires completed Play setup)
        type: boolean
        default: false
      release_status:
        description: Play release status
        type: choice
        options: [draft, completed]
        default: draft
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: play-internal
  cancel-in-progress: false
jobs:
  authorize:
    name: 1. Authorize release request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, '#build-and-deploy') || contains(github.event.comment.body, '#deploy-playstore')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.request.outputs.ref }}
      publish: ${{ steps.request.outputs.publish }}
      status: ${{ steps.request.outputs.status }}
    steps:
      - name: Validate request and select source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: request
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          PLAY_READY: ${{ vars.PLAY_PUBLISH_ENABLED }}
        with:
          script: |
            const {data: access} = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor
            });
            if (!['admin', 'write', 'maintain'].includes(access.permission)) {
              throw new Error('Only repository maintainers may request signed builds.');
            }
            let ref = context.sha;
            let publish = process.env.PUBLISH === 'true';
            let status = process.env.RELEASE_STATUS || 'draft';
            if (context.eventName === 'issue_comment') {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
              if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('Release comments require a PR from this repository; forks are not eligible.');
              }
              if (pr.merged) {
                if (pr.base.ref !== 'main' || !pr.merge_commit_sha) {
                  throw new Error('Merged PR releases require a merge into main and an available merge commit.');
                }
                ref = pr.merge_commit_sha;
              } else if (pr.state === 'open') {
                ref = pr.head.sha;
              } else {
                throw new Error('Release comments require an open or merged PR; closed unmerged PRs are not eligible.');
              }
              publish = true;
              status = 'completed';
            } else if (context.ref !== 'refs/heads/main') {
              throw new Error('Run manual releases from main. For a trusted PR, use the release comment.');
            }
            if (publish && process.env.PLAY_READY !== 'true') {
              throw new Error('Play publishing is disabled (PLAY_PUBLISH_ENABLED is not true). Verify the first bundle upload and publisher access in Play Console, then enable the repository variable. To build without publishing, run Play internal release on main with publish unchecked.');
            }
            core.setOutput('ref', ref);
            core.setOutput('publish', String(publish));
            core.setOutput('status', status);
            core.notice('Authorization passed. The signed build and Play upload run in the separate "2. Build and publish" job.');
            await core.summary.addRaw(
              `## Release request authorized\n\nSource: \`${ref}\`\n\n` +
              (publish ? `Destination: Play internal testing (${status}).\n\n` : 'Build only: no Play upload requested.\n\n') +
              'This job has not built or uploaded an app. Open **2. Build and publish** for progress and the final result.\n'
            ).write();
  release:
    name: 2. Build and publish
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: play-internal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure upload signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: python3 scripts/setup_signing.py --ci
      - name: Build signed bundle
        id: bundle
        shell: bash
        run: |
          code=$(($(date +%s) - 1577836800))
          flutter build appbundle --release --build-number="$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          source_commit=$(git rev-parse HEAD)
          echo "Built commit $source_commit with version code $code" >> "$GITHUB_STEP_SUMMARY"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - name: Save signed bundle for manual recovery
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revev-play-${{ steps.bundle.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
      - name: Upload internal release
        id: publish
        if: needs.authorize.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.platypus.revev
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ needs.authorize.outputs.status }}
          releaseName: RevEV internal ${{ steps.bundle.outputs.code }}
      - name: Report build and publishing outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.bundle.outcome }}
          UPLOAD_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISH_REQUESTED: ${{ needs.authorize.outputs.publish }}
          RELEASE_STATUS: ${{ needs.authorize.outputs.status }}
          VERSION_CODE: ${{ steps.bundle.outputs.code }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        shell: bash
        run: |
          {
            echo '## Build and publish result'
            echo
            echo "Job: $JOB_STATUS. Signed bundle: $BUILD_OUTCOME. Play upload: $UPLOAD_OUTCOME."
            echo
            if [ "$UPLOAD_OUTCOME" = success ]; then
              echo "Play accepted version $VERSION_CODE on the internal track with status $RELEASE_STATUS."
              if [ "$RELEASE_STATUS" = draft ]; then
                echo 'This is a draft, not a release available to testers.'
              fi
            elif [ "$PUBLISH_REQUESTED" != true ]; then
              echo 'Build-only request: this run does not publish to Play.'
            elif [ "$BUILD_OUTCOME" != success ]; then
              echo 'No Play upload was attempted because the build did not finish successfully. Inspect the first failed or cancelled step above.'
            else
              echo 'Publishing did not complete. Inspect Upload internal release for the Play API error. The signed artifact can be uploaded manually without rebuilding.'
            fi
            if [ -n "$ARTIFACT_URL" ]; then
              echo
              echo "[Download signed bundle]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
